# MicroHydros - brokerkonfiguration
#
# Minimal med flit. Brokern ar en infrastrukturdel som ska vara trakig.
#
# allow_anonymous true ar acceptabelt pa ett isolerat labbnat och under
# utveckling, men det ar INTE acceptabelt i en skarp installation. Se
# docs/teknisk-dokumentation.md, avsnittet Kanda begransningar, dar bade det och
# avsaknaden av TLS ar listade som atgarder infor nasta utvecklingsfas.
# Raderna som behovs star forberedda nedan.

listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice

# Infor skarp drift, avkommentera och lagg till certifikat och losenordsfil:
#
# listener 8883
# allow_anonymous false
# password_file /mosquitto/config/passwd
# cafile   /mosquitto/config/certs/ca.crt
# certfile /mosquitto/config/certs/server.crt
# keyfile  /mosquitto/config/certs/server.key
# require_certificate false
