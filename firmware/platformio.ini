; MicroHydros - byggkonfiguration
;
; Tre miljoer, och det ar ett medvetet upplagg snarare an en bekvamlighet:
;
;   esp32dev   Riktig firmware for malhardvaran. Arduino-ramverket pa ESP32.
;   native     Enhetstester av hela karnan, kompilerade och korda pa
;              utvecklingsdatorn. Ingen hardvara inblandad, ingen flashning,
;              hela sviten gar pa nagra sekunder.
;   simnode    Samma applikationskod som pa ESP32, men lankad mot simulerade
;              sensorer och en NDJSON-transport. Kor pa datorn och pratar med den
;              riktiga gatewayen over ett rör. Det ar sa hela kedjan fran
;              matvarde till databas kan verifieras.
;
; Karnan i lib/mh_core ar ren C++17 utan Arduino-beroenden. Det ar hela
; anledningen till att native- och simnode-miljoerna gar att bygga alls, och
; darmed till att logiken kunde testas systematiskt istallet for genom att stirra
; pa en seriell terminal.

[platformio]
default_envs = esp32dev
src_dir = src

[env]
build_flags =
    -Wall
    -Wextra
    -DMH_FIRMWARE_VERSION=\"1.0.0\"

; ---------------------------------------------------------------------------
; Malhardvara: ESP32 DevKitC (ESP32-WROOM-32)
; ---------------------------------------------------------------------------
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
    ${env.build_flags}
    -std=gnu++17
lib_deps =
    paulstoffregen/OneWire@^2.3.8
    knolleary/PubSubClient@^2.8
lib_ignore = mh_sim

; ---------------------------------------------------------------------------
; Enhetstester pa utvecklingsdatorn
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_flags =
    ${env.build_flags}
    -std=c++17
    -DMH_NATIVE_BUILD
build_src_filter = +<simnode_main.cpp>
lib_ignore = mh_hw

; ---------------------------------------------------------------------------
; Simuleringsnod: applikationen mot simulerad hardvara, kor pa datorn
; ---------------------------------------------------------------------------
[env:simnode]
platform = native
build_flags =
    ${env.build_flags}
    -std=c++17
    -DMH_NATIVE_BUILD
build_src_filter = +<simnode_main.cpp>
lib_ignore = mh_hw
